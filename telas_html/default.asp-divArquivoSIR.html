  <!-- inicio Modal Arquivo SIR -->
    <div id="divArquivoSIR" class="modal modal-wide fade" >
      <div class="modal-dialog"  style="width:1000px">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
            <h4 class="modal-title">Exibir dados Arquivo SIR</h4>
          </div>
          <div class="modal-body"> 
            <div class="input-group">
              <div class="col-md-1">
                <label class="control-label">Latitude</label>  
                <span class="input-group-addon input-sm">Sinal</span>
                <input type="text" class="form-control input-sm clearcoord" maxlength="1" id="SinalLatSIR" name="SinalLatSIR"  placeholder="Sinal" />	
              </div>
              <div class="col-md-1">
                <label class="control-label" for="GrauLatSIR"  > SIRGAS2000</label> 
                <span class="input-group-addon input-sm">G</span>
                <input type="text" class="form-control input-sm clearcoord" maxlength="2" id="GrauLatSIR" name="GrauLatSIR"  placeholder="Grau" />
              </div>
              <div class="col-md-1">
                <label class="control-label" for="MinLatSIR">&nbsp;</label> 
                <span class="input-group-addon input-sm">M</span>
                <input type="text" class="form-control input-sm clearcoord" maxlength="2" id="MinLatSIR" name="MinLatSIR"  placeholder="Minuto" />
              </div>
              <div class="col-md-2">
                <label class="control-label" for="SegLatSIR"  >&nbsp;</label> 
                <span class="input-group-addon input-sm">S</span>
                <input type="text" class="form-control input-sm clearcoord" id="SegLatSIR" name="SegLatSIR" placeholder="Segundo" />	
              </div> 	  
              <div class="col-md-1">
                <label class="control-label" >Longitude</label>
                <span class="input-group-addon input-sm">Sinal</span>
                <input type="text" class="form-control input-sm clearcoord" maxlength="1" id="SinalLonSIR" name="SinalLonSIR"  text="-" placeholder="Sinal" />	
              </div>
              <div class="col-md-1">
                <label class="control-label" for="GrauLonSIR"  > SIRGAS2000</label>
                <span class="input-group-addon input-sm">G</span>
                <input type="text" class="form-control input-sm clearcoord" maxlength="2"  id="GrauLonSIR" name="GrauLonSIR"  placeholder="Grau" />
              </div>
              <div class="col-md-1">
                <label class="control-label" for="MinLonSIR"  >&nbsp;</label>
                <span class="input-group-addon input-sm">M</span>
                <input type="text" class="form-control input-sm clearcoord" maxlength="2" id="MinLonSIR" name="MinLonSIR"  placeholder="Minuto" />
              </div>
              <div class="col-md-2">
                <label class="control-label" for="SegLonSIR"  >&nbsp;</label>
                <span class="input-group-addon input-sm">S</span>
                <input type="text" class="form-control input-sm clearcoord" id="SegLonSIR" name="SegLonSIR" placeholder="Segundo"  />	
              </div>
            </div>
          </div>
        </div>
      </div>
    </div> 
    <!-- Final Modal Arquivo SIR -->
