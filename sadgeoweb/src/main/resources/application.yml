spring:
  application:
    name: sadgeo
  datasource:
    url: ${SADGEO_DB_URL:}
    username: ${SADGEO_DB_USERNAME:}
    password: ${SADGEO_DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${SADGEO_DB_SCHEMA:BDG_VALIDA}
  jackson:
    time-zone: America/Sao_Paulo
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info

sadgeo:
  auth:
    ldap:
      host: ${SADGEO_LDAP_HOST:}
      port: ${SADGEO_LDAP_PORT:636}
      domain: ${SADGEO_LDAP_DOMAIN:}
      base-dn: ${SADGEO_LDAP_BASE_DN:}
      url: ${SADGEO_LDAP_URL:}
      connect-timeout-ms: ${SADGEO_LDAP_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${SADGEO_LDAP_READ_TIMEOUT_MS:10000}
