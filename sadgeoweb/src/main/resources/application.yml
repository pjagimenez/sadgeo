spring:
  application:
    name: sadgeo
  datasource:
    url: ${SADGEO_DB_URL:}
    username: ${SADGEO_DB_USERNAME:}
    password: ${SADGEO_DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${SADGEO_DB_SCHEMA:BDG_VALIDA}
  jackson:
    time-zone: America/Sao_Paulo
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info

sadgeo:
  auth:
    ldap-url: ${SADGEO_LDAP_URL:}
    ldap-domain: ${SADGEO_LDAP_DOMAIN:}
